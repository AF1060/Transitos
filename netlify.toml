[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

  [build.environment]
    NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# O frontend chama /api/<nome>, redirecionado aqui para a função Netlify correspondente —
# evita escrever "/.netlify/functions/..." espalhado pelo código do browser.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
